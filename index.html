.w{max-width:var(--mw);margin:0 auto;padding:0 28px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r12);font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:-.01em;transition:all var(--tr);white-space:nowrap;cursor:pointer;border:1.5px solid transparent;position:relative}
.btn:disabled{opacity:.44;cursor:not-allowed;pointer-events:none}
.bl{background:var(--lime);color:var(--bg);border-color:var(--lime)}.bl:hover{background:#d2f55a;transform:translateY(-1px);box-shadow:0 8px 24px rgba(200,240,77,.28)}
.bo{background:transparent;color:var(--t1);border-color:var(--bm)}.bo:hover{border-color:var(--lime);color:var(--lime);background:var(--ld)}
.bg_{background:var(--surf);color:var(--t2);border-color:var(--b)}.bg_:hover{border-color:var(--bm);color:var(--t1)}
.bd{background:rgba(239,68,68,.12);color:var(--err);border-color:rgba(239,68,68,.2)}.bd:hover{background:rgba(239,68,68,.22)}

.card{background:var(--surf);border:1px solid var(--b);border-radius:var(--r20);overflow:hidden;transition:border-color var(--tr),transform var(--tr),box-shadow var(--tr)}

const fcfa=n=>new Intl.NumberFormat('fr-SN',{style:'currency',currency:'XOF',maximumFractionDigits:0}).format(n||0);
const calcP=(usd,m=CFG.MARGIN)=>Math.ceil((parseFloat(usd||0)+CFG.SHIP)*m*CFG.USD_FCFA);
const slug_=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

function showToast(msg,type='inf',dur=3400){
  const c=document.getElementById('toasts');if(!c)return;
  const el=document.createElement('div');el.className='toast t'+type;
  const ic={ok:'✓',err:'✕',inf:'ℹ'};
  el.innerHTML='<span style="font-size:14px;font-weight:700">'+(ic[type]||'i')+'</span><span>'+msg+'</span>';
  el.onclick=()=>el.remove();c.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(20px)';el.style.transition='all .3s';setTimeout(()=>el.remove(),300)},dur);
}
const T={ok:m=>showToast(m,'ok'),err:m=>showToast(m,'err',4500),inf:m=>showToast(m,'inf')};

function useRoute(){
  const [r,setR]=useState(()=>location.hash.slice(1)||'/');
  useEffect(()=>{const h=()=>setR(location.hash.slice(1)||'/');window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);
  return r;
}
const go=p=>{location.hash=p};

const AuthCtx=createContext(null);
function AuthProvider({children}){
  const [user,setUser]=useState(()=>{try{return JSON.parse(sessionStorage.getItem('sd_u'))}catch{return null}});
  const login=u=>{sessionStorage.setItem('sd_u',JSON.stringify(u));setUser(u)};
  const logout=()=>{sessionStorage.removeItem('sd_u');setUser(null);go('/')};
  return <AuthCtx.Provider value={{user,login,logout}}>{children}</AuthCtx.Provider>;
}
const useAuth=()=>useContext(AuthCtx);

const CartCtx=createContext(null);
function CartProvider({children}){
  const [items,setItems]=useState(()=>{try{return JSON.parse(localStorage.getItem('sd_cart')||'[]')}catch{return[]}});
  const save=n=>{localStorage.setItem('sd_cart',JSON.stringify(n));setItems(n)};
  const add=(p,qty=1)=>{
    const key=String(p.id);const found=items.find(i=>i.key===key);
    const price=p.store_price||p.price_fcfa||calcP(p.sellPrice||0);
    save(found?items.map(i=>i.key===key?{...i,quantity:i.quantity+qty}:i):[...items,{key,productId:p.id,name:p.name||p.productNameEn,image:p.images?.[0]||p.productImage,priceFCFA:price,quantity:qty,supplier:p.supplier}]);
    T.ok('Ajouté au panier !');
  };
  const rm=key=>save(items.filter(i=>i.key!==key));
  const setQty=(key,q)=>q<=0?rm(key):save(items.map(i=>i.key===key?{...i,quantity:q}:i));
  const clear=()=>save([]);
  const subtotal=useMemo(()=>items.reduce((s,i)=>s+i.priceFCFA*i.quantity,0),[items]);
  const count=useMemo(()=>items.reduce((s,i)=>s+i.quantity,0),[items]);
  return <CartCtx.Provider value={{items,add,rm,setQty,clear,subtotal,count}}>{children}</CartCtx.Provider>;
}
const useCart=()=>useContext(CartCtx);

async function apiCall(path,opts={}){
  const headers={'Content-Type':'application/json',...(opts.headers||{})};
  headers['x-admin-token']=sessionStorage.getItem('sd_tok')||'ADMIN_TOK';
  try{
    const r=await fetch(path,{...opts,headers});
    const d=await r.json();
    if(!r.ok)throw new Error(d?.error||'Erreur '+r.status);
    return d;
  }catch(e){
    // Fallback demo uniquement si le serveur est complètement inaccessible
    const isNetErr=e.message.includes('Failed to fetch')||e.message.includes('NetworkError');
    if(isNetErr){
      if(path.includes('/api/products'))return{success:true,data:DEMO,total:DEMO.length};
      if(path.includes('/api/categories'))return{success:true,data:[{name:'Électronique',slug:'electronique',icon:'📱'},{name:'Mode',slug:'mode',icon:'👗'},{name:'Maison',slug:'maison',icon:'🏠'}]};
      if(path.includes('/api/admin/stats'))return{success:true,data:{products:0,paid_orders:0,pending_orders:0,revenue:0,monthly:0}};
      if(path.includes('/api/admin/orders')||path.includes('/api/orders'))return{success:true,data:[],total:0};
      if(path.includes('/api/admin/products'))return{success:true,data:DEMO,total:DEMO.length};
      if(path.includes('/api/cj/'))return{success:false,data:[],total:0,error:'Serveur inaccessible'};
    }
    throw e;
  }
}

          <div className="card" style={{padding:20}}><h3 style={{fontFamily:'var(--fd)',fontWeight:700,fontSize:13,marginBottom:14}}>Adresse de livraison</h3>
            <div className="field"><label className="lbl">Adresse *</label><input className="inp" placeholder="Rue, quartier, point de repere" value={cust.address.street} onChange={e=>setCust(p=>({...p,address:{...p.address,street:e.target.value}}))}/></div>
            <div className="g2"><div className="field"><label className="lbl">Ville</label><select className="inp" value={cust.address.city} onChange={e=>setCust(p=>({...p,address:{...p.address,city:e.target.value}}))}>{CITIES.map(c=><option key={c}>{c}</option>)}</select></div><div className="field"><label className="lbl">Code postal</label><input className="inp" placeholder="10000" value={cust.address.zip} onChange={e=>setCust(p=>({...p,address:{...p.address,zip:e.target.value}}))}/></div></div></div>
          {allShippers.length>0&&(<div className="card" style={{padding:20}}><h3 style={{fontFamily:'var(--fd)',fontWeight:700,fontSize:13,marginBottom:14}}>Mode de livraison</h3>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {allShippers.map(sh=>(<label key={sh.id} style={{display:'flex',alignItems:'center',gap:11,padding:12,borderRadius:'var(--r12)',border:'2px solid '+((selShip||allShippers[0]?.id)===sh.id?'var(--lime)':'var(--b)'),background:(selShip||allShippers[0]?.id)===sh.id?'var(--ld)':'transparent',cursor:'pointer',transition:'all var(--tr)'}}>
                <input type="radio" name="ship" checked={(selShip||allShippers[0]?.id)===sh.id} onChange={()=>setSelShip(sh.id)} style={{accentColor:'var(--lime)'}}/>
                <div style={{flex:1}}><div style={{fontWeight:600,fontSize:13}}>{sh.supFlag} {sh.name}</div><div style={{fontSize:10,color:'var(--t3)',marginTop:2}}>⏱ {sh.delay} · {sh.supName}</div></div>
                <div style={{textAlign:'right'}}><div style={{fontFamily:'var(--fd)',fontWeight:700,color:'var(--lime)',fontSize:13}}>{sh.price>0?fcfa(sh.price):'Inclus'}</div></div>
              </label>))}
            </div>
          </div>)}
        </div>
        <div style={{position:'sticky',top:72}}>
          <div className="card" style={{padding:18,marginBottom:11}}>
            <h3 style={{fontFamily:'var(--fd)',fontWeight:700,fontSize:13,marginBottom:12}}>Votre commande</h3>
            {items.map(i=>(<div key={i.key} style={{display:'flex',justifyContent:'space-between',marginBottom:7,fontSize:12}}><span style={{flex:1,marginRight:7,color:'var(--t2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{i.name} x{i.quantity}</span><span style={{fontWeight:600,flexShrink:0}}>{fcfa(i.priceFCFA*i.quantity)}</span></div>))}
            <div className="div_"/>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:5}}><span style={{color:'var(--t3)'}}>Livraison</span><span style={{color:'var(--lime)',fontWeight:600}}>{shipCost>0?fcfa(shipCost):'Incluse'}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',fontFamily:'var(--fd)',fontWeight:900,fontSize:17}}><span>Total</span><span style={{color:'var(--lime)'}}>{fcfa(grand)}</span></div>
          </div>
          {err&&<div style={{background:'rgba(239,68,68,.1)',border:'1px solid rgba(239,68,68,.2)',color:'var(--err)',padding:'8px 12px',borderRadius:'var(--r8)',fontSize:12,marginBottom:9}}>{err}</div>}
          <button className="btn bl bfw blg" onClick={submit} disabled={submitting}>{submitting?'Traitement...':'💳 Payer maintenant'}</button>
          <p style={{textAlign:'center',marginTop:8,fontSize:10,color:'var(--t4)'}}>🔒 Wave · Orange Money · PayTech</p>
        </div>
      </div>
    </div>
  </div>);
}

function SuccessPage(){
  const {clear}=useCart();useEffect(()=>clear(),[]);
  const orderId=location.hash.match(/order=([^&]+)/)?.[1]||'ORD-XXXX';
  return(<div style={{paddingTop:80,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'100px 20px'}}>
    <div style={{textAlign:'center',maxWidth:440}}>
      <div style={{width:84,height:84,background:'rgba(34,197,94,.1)',border:'1px solid rgba(34,197,94,.2)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:38,margin:'0 auto 20px'}}>✓</div>
      <h1 style={{fontFamily:'var(--fd)',fontWeight:900,fontSize:26,color:'var(--ok)',marginBottom:7}}>Commande confirmée !</h1>
      <p style={{color:'var(--t3)',fontSize:14,marginBottom:5}}>Merci ! Votre paiement a été reçu.</p>
      <p style={{fontSize:12,color:'var(--t4)',marginBottom:20}}>Ref : <strong style={{color:'var(--t2)'}}>{orderId.slice(0,12).toUpperCase()}</strong></p>
      <div style={{background:'var(--surf)',border:'1px solid var(--b)',borderRadius:'var(--r16)',padding:16,marginBottom:22,fontSize:12,color:'var(--t2)',lineHeight:1.8,textAlign:'left'}}>
        📧 Email de confirmation envoyé avec le suivi<br/>📦 Commande transmise au fournisseur<br/>🚚 Livraison selon expediteur choisi
      </div>
      <button className="btn bl blg" onClick={()=>go('/marketplace')}>Continuer mes achats</button>
    </div>
  </div>);
}

function PricingPage(){return(<div style={{paddingTop:80,minHeight:'100vh'}}>
  <div className="w" style={{padding:'60px 28px 76px'}}>
    <div style={{textAlign:'center',marginBottom:44}}><div className="badge bgl" style={{marginBottom:12}}>Tarifs</div><h1 style={{fontFamily:'var(--fd)',fontWeight:900,fontSize:'clamp(26px,5vw,50px)',marginBottom:11}}>Simple et transparent</h1></div>
    <div className="g3" style={{maxWidth:880,margin:'0 auto',gap:12}}>
      {[{n:'Débutant',p:'Gratuit',c:'var(--t2)',pop:false,feats:['1 boutique','50 produits','Commission 5%','URL SoukDrop','Wave & Orange Money','QR Code inclus','Produits personnels'],cta:'Démarrer gratuitement',a:'/register'},
       {n:'Pro',p:'9 900 FCFA/mois',c:'var(--lime)',pop:true,feats:['3 boutiques','500 produits','Commission 2%','Support prioritaire','Domaine personnalisé','Analytics','Multi-fournisseurs'],cta:'Choisir Pro',a:'/register?plan=pro'},
       {n:'Entreprise',p:'24 900 FCFA/mois',c:'var(--amb)',pop:false,feats:['Boutiques illimitées','Produits illimités','Commission 0%','Manager dédié','API complete','Marque blanche'],cta:'Nous contacter',a:'/'}].map((pl,i)=>(
        <div key={i} className="card" style={{padding:26,position:'relative',border:pl.pop?'1px solid rgba(200,240,77,.28)':'1px solid var(--b)'}}>
          {pl.pop&&<div style={{position:'absolute',top:-1,left:'50%',transform:'translateX(-50%)',background:'var(--lime)',color:'#09090E',fontSize:9,fontWeight:900,padding:'3px 13px',borderRadius:'0 0 8px 8px',fontFamily:'var(--fd)'}}>RECOMMANDE</div>}
          <div style={{fontFamily:'var(--fd)',fontWeight:900,fontSize:17,marginBottom:3}}>{pl.n}</div>
          <div style={{fontFamily:'var(--fd)',fontWeight:900,fontSize:30,color:pl.c,marginBottom:16,letterSpacing:'-.02em',lineHeight:1.1}}>{pl.p}</div>
          <div className="div_"/>
          <div style={{display:'flex',flexDirection:'column',gap:9,marginBottom:20}}>{pl.feats.map((f,j)=><div key={j} style={{display:'flex',gap:8,fontSize:12,color:'var(--t2)'}}><span style={{color:'var(--ok)',flexShrink:0}}>✓</span>{f}</div>)}</div>
          <button className={'btn bfw '+(pl.pop?'bl':'bo')} onClick={()=>pl.id==='Débutant'?pl.id==='starter'?go(pl.a):T.inf('Contactez-nous sur WhatsApp +221 77 029 96 03 pour activer le plan '+pl.n):T.inf('Contactez-nous sur WhatsApp : +221 77 029 96 03 pour activer le plan '+pl.n)}>{pl.cta}</button>
        </div>
      ))}
    </div>
  </div>
  <Footer/>
</div>);}

function App(){
  const route=useRoute();const {user}=useAuth();
  const r=route.split('?')[0];
  const page=()=>{
    if(r==='/'||r==='')return 'land';if(r==='/marketplace')return 'market';
    if(r.startsWith('/store/'))return 'store';if(r==='/login')return 'login';
    if(r==='/register')return 'reg';if(r==='/dashboard')return 'dash';
    if(r==='/platform-admin')return 'admin';if(r==='/panier')return 'cart';
    if(r==='/commande/succes')return 'success';
    if(r==='/commande')return 'checkout';
    if(r.startsWith('/produit/'))return 'produit';
    if(r==='/pricing')return 'pricing';
    return 'land';
  };
  const p=page();const slug__=route.split('/store/')[1]?.split('?')[0];
  const produitId=route.split('/produit/')[1]?.split('?')[0];
  useEffect(()=>{if(p==='dash'&&!user)go('/login');if(p==='admin'&&user?.role!=='platform_admin')go('/login')},[p,user]);
  const pages={land:<Landing/>,market:<Marketplace/>,store:<StorePage slug_={slug__}/>,login:<LoginPage/>,reg:<RegisterPage/>,dash:user?<SellerDashboard/>:null,admin:user?.role==='platform_admin'?<PlatformAdmin/>:null,cart:<CartPage/>,checkout:<CheckoutPage/>,success:<SuccessPage/>,pricing:<PricingPage/>,produit:<ProductPage id={produitId}/>};
  return(<div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}><Navbar route={route}/><div style={{flex:1,animation:'fadeUp .35s ease'}} key={p}>{pages[p]||<Landing/>}</div></div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthProvider><CartProvider><App/></CartProvider></AuthProvider>);
</script>
</body>
</html>
