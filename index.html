<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SoukDrop — Livraison rapide au Sénégal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0A0A0F;--bg2:#111118;--surf:#16161F;--pan:#1D1D28;
  --b:rgba(255,255,255,.06);--bm:rgba(255,255,255,.12);
  --lime:#B9FF4B;--ld:rgba(185,255,75,.12);--ldb:rgba(185,255,75,.06);
  --pur:#7C3AED;--purl:rgba(124,58,237,.15);
  --t1:#FAFAFA;--t2:rgba(250,250,250,.65);--t3:rgba(250,250,250,.35);--t4:rgba(250,250,250,.15);
  --ok:#22C55E;--err:#F43F5E;--warn:#F59E0B;--info:#3B82F6;
  --ff:'Plus Jakarta Sans',sans-serif;
  --r6:6px;--r10:10px;--r14:14px;--r20:20px;--r28:28px;--rf:9999px;
  --sh:0 2px 12px rgba(0,0,0,.4);--shx:0 12px 40px rgba(0,0,0,.6);
  --tr:.15s ease;--mw:1320px
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--ff);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
::selection{background:var(--lime);color:#000}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--bm);border-radius:2px}
.w{max-width:var(--mw);margin:0 auto;padding:0 24px}
@media(max-width:640px){.w{padding:0 16px}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border-radius:var(--r10);font-family:var(--ff);font-weight:700;font-size:14px;transition:all var(--tr);white-space:nowrap;cursor:pointer;border:1.5px solid transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.bl{background:var(--lime);color:#000;border-color:var(--lime)}.bl:hover{background:#c8ff5a;transform:translateY(-1px);box-shadow:0 6px 20px rgba(185,255,75,.3)}
.bo{background:transparent;color:var(--t1);border-color:var(--bm)}.bo:hover{border-color:var(--lime);color:var(--lime)}
.bg_{background:var(--surf);color:var(--t2);border-color:var(--b)}.bg_:hover{border-color:var(--bm);color:var(--t1)}
.bpurp{background:var(--pur);color:#fff;border-color:var(--pur)}.bpurp:hover{background:#6d28d9}
.bd{background:rgba(244,63,94,.1);color:var(--err);border-color:rgba(244,63,94,.2)}
.bsm{padding:6px 12px;font-size:12px;border-radius:var(--r6)}.blg{padding:13px 26px;font-size:16px}.bxl{padding:16px 32px;font-size:17px}.bfw{width:100%}

/* Cards */
.card{background:var(--surf);border:1px solid var(--b);border-radius:var(--r20);transition:border-color var(--tr)}
.card:hover{border-color:var(--bm)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--rf);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bgl{background:var(--ld);color:var(--lime)}.bgr{background:rgba(244,63,94,.1);color:var(--err)}.bgg{background:rgba(34,197,94,.1);color:var(--ok)}.bgy{background:rgba(245,158,11,.1);color:var(--warn)}.bgb{background:rgba(59,130,246,.1);color:var(--info)}.bgn{background:var(--surf);color:var(--t3);border:1px solid var(--b)}.bgp{background:var(--purl);color:#a78bfa}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.lbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;padding:10px 14px;background:var(--bg2);border:1.5px solid var(--b);border-radius:var(--r10);font-size:14px;color:var(--t1);transition:border-color var(--tr);outline:none}
.inp:focus{border-color:var(--lime);box-shadow:0 0 0 3px var(--ldb)}.inp::placeholder{color:var(--t4)}

/* Nav */
#nav{position:fixed;top:0;left:0;right:0;z-index:300;background:rgba(10,10,15,.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--b)}

/* Sidebar */
.sb{width:224px;background:var(--bg2);border-right:1px solid var(--b);padding:16px 8px;position:sticky;top:60px;height:calc(100vh - 60px);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sbtn{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:var(--r10);cursor:pointer;background:transparent;color:var(--t3);font-size:13px;font-weight:500;text-align:left;transition:all var(--tr);width:100%;border:none}
.sbtn:hover{background:var(--surf);color:var(--t1)}.sbtn.on{background:var(--ld);color:var(--lime);font-weight:700}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.fu{animation:fadeUp .35s ease both}.fi{animation:fadeIn .25s ease both}
.spin_{width:28px;height:28px;border:2px solid var(--b);border-top-color:var(--lime);border-radius:50%;animation:spin .6s linear infinite;margin:48px auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite;display:inline-block}
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column-reverse;gap:8px;z-index:9999;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:var(--r10);font-size:13px;font-weight:600;max-width:320px;animation:fadeUp .25s ease;pointer-events:all;box-shadow:var(--shx);border:1px solid}
.tok{background:var(--surf);border-color:rgba(34,197,94,.3);color:var(--ok)}.terr{background:var(--surf);border-color:rgba(244,63,94,.3);color:var(--err)}.tinf{background:var(--surf);border-color:var(--bm);color:var(--t1)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px);animation:fadeIn .2s ease}
.modal{background:var(--bg2);border:1px solid var(--bm);border-radius:var(--r28);max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shx);animation:fadeUp .25s ease;padding:28px}
.tabs{display:flex;gap:2px;background:var(--bg2);padding:3px;border-radius:var(--r10)}
.tab{padding:7px 13px;font-weight:700;font-size:12px;border-radius:var(--r6);cursor:pointer;transition:all var(--tr);color:var(--t3);background:transparent;border:none;white-space:nowrap}
.tab.on{background:var(--surf);color:var(--t1);box-shadow:var(--sh)}
.tbl{overflow-x:auto;border-radius:var(--r14);border:1px solid var(--b)}
table{width:100%;border-collapse:collapse}thead tr{background:var(--bg2)}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);white-space:nowrap}
td{padding:11px 14px;font-size:13px;color:var(--t2);border-top:1px solid var(--b)}
tbody tr:hover td{background:rgba(255,255,255,.015)}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.g3{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
@media(max-width:640px){.pgrid{grid-template-columns:repeat(2,1fr);gap:8px}}
.sc{background:var(--surf);border:1px solid var(--b);border-radius:var(--r14);padding:16px 18px}
.pill{display:inline-block;padding:4px 11px;border-radius:var(--rf);font-size:12px;font-weight:600;background:var(--surf);border:1px solid var(--b);color:var(--t2);cursor:pointer;transition:all var(--tr)}
.pill:hover,.pill.on{background:var(--ld);border-color:rgba(185,255,75,.25);color:var(--lime)}
.div_{height:1px;background:var(--b);margin:14px 0}
.gt{background:linear-gradient(135deg,var(--lime),#A8EDEA,#B9FF4B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useContext,createContext}=React;

// ── Config ────────────────────────────────────────────────────────
const DEMO=[
  {id:'d1',cj_pid:'DEMO1',name:'Écouteurs Bluetooth Sans Fil',price_fcfa:18500,images:['https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=70'],category:'Électronique',status:'active'},
  {id:'d2',cj_pid:'DEMO2',name:'Montre Connectée Sport',price_fcfa:24900,images:['https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=70'],category:'Électronique',status:'active'},
  {id:'d3',cj_pid:'DEMO3',name:'Sac à Main Élégant',price_fcfa:15800,images:['https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=400&q=70'],category:'Mode & Vêtements',status:'active'},
  {id:'d4',cj_pid:'DEMO4',name:'Lampe LED Décorative',price_fcfa:8900,images:['https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&q=70'],category:'Maison & Jardin',status:'active'},
  {id:'d5',cj_pid:'DEMO5',name:'Chargeur Sans Fil Rapide',price_fcfa:12500,images:['https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400&q=70'],category:'Électronique',status:'active'},
  {id:'d6',cj_pid:'DEMO6',name:'Sneakers Urban Style',price_fcfa:22000,images:['https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=70'],category:'Mode & Vêtements',status:'active'},
  {id:'d7',cj_pid:'DEMO7',name:'Robot de Cuisine Multifonction',price_fcfa:35000,images:['https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&q=70'],category:'Cuisine',status:'active'},
  {id:'d8',cj_pid:'DEMO8',name:'Bracelet Connecté Fitness',price_fcfa:16900,images:['https://images.unsplash.com/photo-1575311373937-040b8e1fd5b6?w=400&q=70'],category:'Sport & Fitness',status:'active'},
];
const BASE=window.location.origin;
const ADMIN_PASS='Ameth123';
const PLANS={
  starter:{id:'starter',name:'Starter',price:0,label:'Gratuit',comm:.05,max:50,icon:'🌱'},
  pro:{id:'pro',name:'Pro',price:9900,label:'9 900 FCFA/mois',comm:.02,max:500,icon:'⚡'},
  business:{id:'business',name:'Business',price:24900,label:'24 900 FCFA/mois',comm:0,max:999999,icon:'💎'}
};

// ── Utils ─────────────────────────────────────────────────────────
const go=p=>{window.location.hash=p;window.scrollTo(0,0)};
const route=()=>decodeURIComponent(window.location.hash.slice(1)||'/');
const fcfa=n=>new Intl.NumberFormat('fr-SN',{style:'currency',currency:'XOF',maximumFractionDigits:0}).format(n||0);
const slug_=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

const T={
  show:(m,c)=>{const el=document.createElement('div');el.className='toast '+c;el.textContent=m;const ct=document.getElementById('toasts');ct.appendChild(el);setTimeout(()=>el.remove(),3600)},
  ok:m=>T.show(m,'tok'),err:m=>T.show(m,'terr'),inf:m=>T.show(m,'tinf')
};

async function api(path,opts={}){
  const h={'Content-Type':'application/json',...(opts.headers||{})};
  h['x-admin-token']=sessionStorage.getItem('sd_tok')||'ADMIN_TOK';
  try{
    const r=await fetch(BASE+path,{...opts,headers:h});
    const d=await r.json();
    if(!r.ok)throw new Error(d?.error||'Erreur '+r.status);
    return d;
  }catch(e){
    if(e.message.includes('Failed to fetch'))return{success:false,data:[],total:0,error:'Hors ligne'};
    throw e;
  }
}

// ── Auth ──────────────────────────────────────────────────────────
const AuthCtx=createContext(null);
function AuthProvider({children}){
  const [user,setUser]=useState(()=>{try{const s=sessionStorage.getItem('sd_u');return s?JSON.parse(s):null}catch{return null}});
  const login=u=>{setUser(u);sessionStorage.setItem('sd_u',JSON.stringify(u));if(u.token)sessionStorage.setItem('sd_tok',u.token)};
  const logout=()=>{setUser(null);sessionStorage.removeItem('sd_u');sessionStorage.removeItem('sd_tok');go('/')};
  return <AuthCtx.Provider value={{user,login,logout}}>{children}</AuthCtx.Provider>;
}
const useAuth=()=>useContext(AuthCtx);

// ── Cart ──────────────────────────────────────────────────────────
const CartCtx=createContext(null);
function CartProvider({children}){
  const [items,setItems]=useState([]);
  const add=(p,qty=1)=>setItems(prev=>{const k=p.id;const ex=prev.find(i=>i.key===k);if(ex)return prev.map(i=>i.key===k?{...i,qty:i.qty+qty}:i);return[...prev,{key:k,id:p.id,name:p.name,price:p.price_fcfa,img:(p.images||[])[0]||'',qty,cj_pid:p.cj_pid}]});
  const rm=k=>setItems(p=>p.filter(i=>i.key!==k));
  const setQ=(k,q)=>q<=0?rm(k):setItems(p=>p.map(i=>i.key===k?{...i,qty:q}:i));
  const clear=()=>setItems([]);
  const sub=items.reduce((s,i)=>s+i.price*i.qty,0);
  const count=items.reduce((s,i)=>s+i.qty,0);
  return <CartCtx.Provider value={{items,add,rm,setQ,clear,sub,count}}>{children}</CartCtx.Provider>;
}
const useCart=()=>useContext(CartCtx);

// ── Stat Card ─────────────────────────────────────────────────────
function SC({icon,label,val,sub,color}){
  return <div className="sc">
    <div style={{fontSize:20,marginBottom:8}}>{icon}</div>
    <div style={{fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:3}}>{label}</div>
    <div style={{fontWeight:900,fontSize:22,color:color||'var(--t1)'}}>{val}</div>
    {sub&&<div style={{fontSize:11,color:'var(--t3)',marginTop:2}}>{sub}</div>}
  </div>;
}

// ── Product Card ──────────────────────────────────────────────────
function PCard({p}){
  const {add}=useCart();
  const img=(p.images||[])[0]||'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=400&q=70';
  return <div className="card" style={{display:'flex',flexDirection:'column',overflow:'hidden',cursor:'pointer'}} onClick={()=>go('/produit/'+p.id)}>
    <div style={{aspectRatio:'1',background:'var(--pan)',overflow:'hidden',position:'relative',flexShrink:0}}>
      <img src={img} alt={p.name} style={{width:'100%',height:'100%',objectFit:'cover',transition:'transform .4s'}} onMouseEnter={e=>e.target.style.transform='scale(1.07)'} onMouseLeave={e=>e.target.style.transform='scale(1)'} onError={e=>e.target.src='https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=400&q=70'}/>
      <div style={{position:'absolute',top:8,left:8}}><span className="badge bgl" style={{fontSize:8}}>En stock</span></div>
    </div>
    <div style={{padding:'12px 13px 14px',flex:1,display:'flex',flexDirection:'column',gap:5}}>
      <div style={{fontSize:10,color:'var(--t4)',fontWeight:600,textTransform:'uppercase'}}>{p.category||'Général'}</div>
      <p className="c2" style={{fontSize:13,fontWeight:600,lineHeight:1.4,flex:1}}>{p.name}</p>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:4}}>
        <span style={{fontWeight:900,fontSize:15,color:'var(--lime)'}}>{fcfa(p.price_fcfa)}</span>
        <button className="btn bl bsm" style={{fontSize:10,padding:'5px 10px'}} onClick={e=>{e.stopPropagation();add(p);T.ok('Ajouté !')}}>+ Panier</button>
      </div>
    </div>
  </div>;
}

// ── Footer ────────────────────────────────────────────────────────
function Footer(){
  return <footer style={{borderTop:'1px solid var(--b)',padding:'48px 0 28px',marginTop:80}}>
    <div className="w">
      <div className="g4" style={{marginBottom:36}}>
        <div>
          <div style={{fontWeight:900,fontSize:20,color:'var(--lime)',marginBottom:10}}>SoukDrop</div>
          <p style={{fontSize:12,color:'var(--t3)',lineHeight:1.9}}>La boutique en ligne de référence au Sénégal.<br/>Produits de qualité, livraison rapide.</p>
          <div style={{marginTop:12,display:'flex',gap:8}}>
            <button className="btn bl bsm" onClick={()=>window.open('https://wa.me/221770299603?text=Bonjour SoukDrop')}>💬 WhatsApp</button>
          </div>
        </div>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:12}}>Boutique</div>
          {['Tous les produits','Nouveautés','Promotions','Livraison'].map(l=><div key={l} style={{fontSize:13,color:'var(--t2)',marginBottom:8,cursor:'pointer'}} onClick={()=>go('/marketplace')}>{l}</div>)}
        </div>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:12}}>Vendeurs</div>
          {['Créer ma boutique','Tarifs','Se connecter','Support'].map(l=><div key={l} style={{fontSize:13,color:'var(--t2)',marginBottom:8,cursor:'pointer'}} onClick={()=>go('/register')}>{l}</div>)}
        </div>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:12}}>Contact</div>
          <div style={{fontSize:13,color:'var(--t2)',marginBottom:8}}>📱 +221 77 029 96 03</div>
          <div style={{fontSize:13,color:'var(--t2)',marginBottom:8}}>📧 support@soukdrop.sn</div>
          <div style={{fontSize:13,color:'var(--t2)',marginBottom:8}}>📍 Dakar, Sénégal</div>
          <div style={{marginTop:12,padding:'10px 12px',background:'var(--surf)',borderRadius:'var(--r10)',border:'1px solid var(--b)'}}>
            <div style={{fontSize:10,color:'var(--t3)',marginBottom:4}}>Paiements acceptés</div>
            <div style={{fontSize:12,fontWeight:600}}>💛 Wave · 🟠 Orange Money</div>
          </div>
        </div>
      </div>
      <div className="div_"/>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--t4)',flexWrap:'wrap',gap:8}}>
        <span>© 2025 SoukDrop. Tous droits réservés.</span>
        <span>🔒 Paiements 100% sécurisés · Livraison garantie</span>
      </div>
    </div>
  </footer>;
}

// ── Navbar ────────────────────────────────────────────────────────
function Navbar(){
  const {user,logout}=useAuth();
  const {count}=useCart();
  const [clicks,setClicks]=useState(0);
  const clickLogo=()=>{const n=clicks+1;setClicks(n);if(n>=3){setClicks(0);go(user?.role==='admin'?'/platform-admin':'/platform-admin');}else go('/')};
  return <nav id="nav">
    <div className="w" style={{display:'flex',alignItems:'center',justifyContent:'space-between',height:60,gap:12}}>
      <div style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',flexShrink:0}} onClick={clickLogo}>
        <div style={{width:30,height:30,background:'var(--lime)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:13,color:'#000'}}>S</div>
        <span style={{fontWeight:900,fontSize:17}}>SoukDrop</span>
      </div>
      <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
        <button className="btn bg_ bsm" onClick={()=>go('/marketplace')}>🛒 Boutique</button>
        <button className="btn bg_ bsm" onClick={()=>go('/pricing')}>Tarifs</button>
        <button className="btn bg_ bsm" style={{position:'relative'}} onClick={()=>go('/panier')}>
          🛍️ Panier{count>0&&<span style={{position:'absolute',top:-5,right:-5,background:'var(--lime)',color:'#000',borderRadius:'50%',width:16,height:16,display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:900}}>{count}</span>}
        </button>
        {user?<>
          <button className="btn bpurp bsm" onClick={()=>go(user.role==='admin'?'/platform-admin':'/dashboard')}>
            {user.role==='admin'?'⚡ Admin':'📊 Dashboard'}
          </button>
          <button className="btn bd bsm" onClick={logout}>Quitter</button>
        </>:<>
          <button className="btn bo bsm" onClick={()=>go('/login')}>Connexion</button>

function CheckoutPage(){
  const {items,sub,clear}=useCart();
  const [c,setC]=useState({name:'',email:'',phone:'',street:'',city:'Dakar'});
  const [busy,setBusy]=useState(false);const [err,setErr]=useState('');
  useEffect(()=>{if(!items.length)go('/panier')},[]);
  const cities=['Dakar','Thiès','Saint-Louis','Ziguinchor','Kaolack','Mbour','Touba','Diourbel','Rufisque','Louga'];
  const total=sub+2500;
  const submit=async()=>{
    setErr('');
    if(!c.name||!c.email||!c.phone||!c.street){setErr('Veuillez remplir tous les champs.');return;}
    if(!c.email.includes('@')){setErr('Email invalide.');return;}
    if(c.phone.length<8){setErr('Numéro de téléphone invalide.');return;}
    setBusy(true);
    try{
      const res=await api('/api/orders/create',{method:'POST',body:JSON.stringify({
        items:items.map(i=>({productId:i.id,name:i.name,quantity:i.qty,priceFCFA:i.price,cj_pid:i.cj_pid})),
        customer:{name:c.name,email:c.email,phone:c.phone,address:{street:c.street,city:c.city}},
        shippingCostFCFA:2500,logisticName:'Standard'
      })});
      if(res.paymentUrl){clear();window.location.href=res.paymentUrl;}
      else setErr('Erreur paiement: '+(res.error||'Service temporairement indisponible. Réessayez.'));
    }catch(e){setErr(e.message||'Erreur serveur.');}
    setBusy(false);
  };
  return <div style={{paddingTop:60,minHeight:'100vh',padding:'80px 0 60px'}}>
    <div className="w">
      <h1 style={{fontWeight:900,fontSize:24,marginBottom:24}}>Finaliser ma commande</h1>

            </div>
            <div className="field"><label className="lbl">Téléphone Wave/OM *</label><input className="inp" placeholder="+221 7X XXX XX XX" value={c.phone} onChange={e=>setC(p=>({...p,phone:e.target.value}))}/></div>
          </div>
          <div className="card" style={{padding:24}}>
            <h3 style={{fontWeight:800,fontSize:15,marginBottom:16}}>Adresse de livraison</h3>
            <div className="field"><label className="lbl">Adresse *</label><input className="inp" placeholder="Rue, Quartier, N°" value={c.street} onChange={e=>setC(p=>({...p,street:e.target.value}))}/></div>
            <div className="field"><label className="lbl">Ville *</label>
              <select className="inp" value={c.city} onChange={e=>setC(p=>({...p,city:e.target.value}))}>
                {cities.map(v=><option key={v} value={v}>{v}</option>)}

          </div>
          {err&&<div style={{padding:12,background:'rgba(244,63,94,.1)',border:'1px solid rgba(244,63,94,.2)',borderRadius:'var(--r10)',fontSize:13,color:'var(--err)',fontWeight:600}}>{err}</div>}
        </div>
        <div className="card" style={{padding:20,position:'sticky',top:72}}>
          <h3 style={{fontWeight:800,fontSize:14,marginBottom:14}}>Votre commande</h3>

          </div>)}

        </div>

// ── QR Code ───────────────────────────────────────────────────────
function QRCode({url,size=150}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current)return;
    ref.current.innerHTML='';
    try{new window.QRCode(ref.current,{text:url,width:size,height:size,colorDark:'#B9FF4B',colorLight:'#0A0A0F',correctLevel:window.QRCode.CorrectLevel.H});}
    catch(e){ref.current.innerHTML='<div style="color:var(--t3);font-size:10px;padding:8px">QR indisponible</div>';}
  },[url,size]);
  return <div ref={ref} style={{display:'inline-flex',justifyContent:'center',padding:8,background:'#0A0A0F',borderRadius:'var(--r10)',border:'1px solid var(--b)'}}/>;
}

function SellerDash(){
  const {user,logout}=useAuth();const [tab,setTab]=useState('overview');

  const [wdAmt,setWdAmt]=useState('');const [wdMethod,setWdMethod]=useState('wave');const [wdBusy,setWdBusy]=useState(false);

    api('/api/products?limit=100').then(d=>setProds(d.data||[]));

                <div style={{padding:'10px 11px 12px',flex:1,display:'flex',flexDirection:'column',gap:5}}>
                  <p style={{fontSize:11,fontWeight:600,lineHeight:1.4,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{p.productNameEn}</p>

                    onClick={()=>doImport(p)} disabled={st==='loading'||st==='done'||prods.length>=plan.max}>

          </div>
        </div>}
      </div>}

      {/* Store */}
      {tab==='store'&&<div className="fi">

          </div>
        </div>
      </div>}

      {/* Retrait */}
      {tab==='withdraw'&&<div className="fi">
        <h1 style={{fontWeight:900,fontSize:22,marginBottom:20}}>Retirer mes gains</h1>

        </div>
        <div className="card" style={{padding:24,maxWidth:480}}>
          <h3 style={{fontWeight:800,fontSize:15,marginBottom:16}}>Faire une demande de retrait</h3>
          <div className="field"><label className="lbl">Méthode</label>
            <div style={{display:'flex',gap:8}}>
              {['wave','om'].map(m=><button key={m} onClick={()=>setWdMethod(m)} style={{flex:1,padding:'10px',borderRadius:'var(--r10)',border:'2px solid '+(wdMethod===m?'var(--lime)':'var(--b)'),background:wdMethod===m?'var(--ld)':'var(--bg2)',color:wdMethod===m?'var(--lime)':'var(--t2)',fontWeight:700,fontSize:13,cursor:'pointer',transition:'all var(--tr)'}}>
                {m==='wave'?'💛 Wave':'🟠 Orange Money'}
              </button>)}
            </div>
          </div>
          <div style={{padding:'10px 12px',background:'var(--bg2)',border:'1px solid var(--b)',borderRadius:'var(--r10)',marginBottom:12,fontSize:13,color:'var(--t2)'}}>
            📱 {wdMethod==='wave'?'Wave':'Orange Money'} : <strong>{wdMethod==='wave'?(user?.wave||'Non renseigné'):(user?.om||'Non renseigné')}</strong>
          </div>

          <button className="btn bl bfw" onClick={doWithdraw} disabled={wdBusy||!wdAmt||net<=0}>{wdBusy?'Envoi...':'💸 Demander le retrait'}</button>

            ℹ️ Votre demande sera traitée sous 24h par notre équipe.
          </div>
        </div>
      </div>}

      {/* Paramètres */}
      {tab==='settings'&&<div className="fi">
        <h1 style={{fontWeight:900,fontSize:22,marginBottom:20}}>Paramètres</h1>
        <div className="card" style={{padding:24,marginBottom:14}}>
          <h3 style={{fontWeight:800,fontSize:14,marginBottom:14}}>Mon compte</h3>
          {[['Nom',user?.name],['Email',user?.email],['Plan',plan.name+' '+plan.icon],['Boutique',user?.store?.name||'—'],['Wave',user?.wave||'Non renseigné'],['Orange Money',user?.om||'Non renseigné']].map(([l,v])=>(

            </div>
          ))}
        </div>
        <button className="btn bpurp" onClick={()=>go('/pricing')}>Changer de plan →</button>
      </div>}
    </main>
  </div>;

function PlatformAdmin(){
  const {user,logout}=useAuth();const [tab,setTab]=useState('overview');

  const [prods,setProds]=useState([]);const [sellers,setSellers]=useState([]);

    Promise.all([api('/api/admin/stats'),api('/api/admin/orders'),api('/api/admin/products'),api('/api/admin/sellers'),api('/api/admin/withdrawals')]).then(([s,o,p,sv,w])=>{
      setStats(s.data);setOrders(o.data||[]);setProds(p.data||[]);setSellers(sv.data||[]);setWithdrawals(w.data||[]);
    }).finally(()=>setLoad(false));
  },[]);

  const updOrder=async(id,status)=>{try{await api('/api/orders/'+id+'/status',{method:'PUT',body:JSON.stringify({status})});setOrders(p=>p.map(o=>o.id===id?{...o,status}:o));T.ok('Statut mis à jour');}catch(e){T.err(e.message);}};
  const certify=async(id,v)=>{try{await api('/api/admin/sellers/'+id+'/certify',{method:'PUT',body:JSON.stringify({certified:v})});setSellers(p=>p.map(s=>s.id===id?{...s,certified:v}:s));T.ok(v?'⭐ Certifié !':'Certification retirée');}catch(e){T.err(e.message);}};

      </div>
      {NAV.map(n=><button key={n.k} className={'sbtn'+(tab===n.k?' on':'')} onClick={()=>setTab(n.k)}>{n.ico} {n.l}</button>)}

        <button className="sbtn" onClick={logout} style={{color:'var(--err)'}}>🚪 Déconnexion</button>
      </div>
    </div>
    <main style={{flex:1,padding:'24px 28px',overflowY:'auto',minWidth:0}}>

            <div style={{fontWeight:800,fontSize:14,color:'var(--warn)',marginBottom:10}}>⚠️ Retraits en attente de traitement</div>
            {withdrawals.filter(w=>w.status==='pending').map(w=><div key={w.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid rgba(255,255,255,.05)',fontSize:13}}>

          {orders.length===0?<div style={{textAlign:'center',padding:'80px 20px'}}><div style={{fontSize:48,marginBottom:12}}>🛍️</div><p style={{color:'var(--t3)'}}>Aucune commande</p></div>:
          <div className="tbl"><table><thead><tr>{['Réf.','Client','Total','Statut','Date','CJ ID','Actions'].map(h=><th key={h}>{h}</th>)}</tr></thead>
            <tbody>{orders.map(o=><tr key={o.id}>
              <td><span style={{fontWeight:700,fontSize:10,fontFamily:'monospace'}}>#{(o.id||'').slice(0,8).toUpperCase()}</span></td>
              <td><div style={{fontWeight:600,fontSize:12}}>{o.customer_name}</div><div style={{fontSize:10,color:'var(--t3)'}}>{o.customer_email}</div><div style={{fontSize:10,color:'var(--t4)'}}>{o.customer_phone}</div></td>
              <td><span style={{fontWeight:900,color:'var(--lime)',fontSize:13}}>{fcfa(o.total_fcfa)}</span></td>
              <td><span className={`badge ${o.status==='paid'||o.status==='delivered'?'bgg':o.status==='shipped'?'bgl':o.status==='cancelled'?'bgr':'bgy'}`} style={{fontSize:8}}>{o.status}</span></td>
              <td style={{fontSize:11,color:'var(--t3)'}}>{new Date(o.created_at).toLocaleDateString('fr-SN')}</td>
              <td style={{fontSize:10,fontFamily:'monospace',color:'var(--t3)'}}>{o.cj_order_id||'—'}</td>
              <td><div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                {o.status==='pending_payment'&&<button className="btn bsm" style={{background:'var(--ld)',color:'var(--lime)',border:'1px solid rgba(185,255,75,.2)',fontSize:9,padding:'4px 8px'}} onClick={()=>updOrder(o.id,'paid')}>✓ Payé</button>}
                {o.status==='paid'&&<button className="btn bsm" style={{background:'rgba(59,130,246,.1)',color:'var(--info)',border:'1px solid rgba(59,130,246,.2)',fontSize:9,padding:'4px 8px'}} onClick={()=>updOrder(o.id,'shipped')}>📦 Expédié</button>}
                {o.status==='shipped'&&<button className="btn bsm" style={{background:'rgba(34,197,94,.1)',color:'var(--ok)',border:'1px solid rgba(34,197,94,.2)',fontSize:9,padding:'4px 8px'}} onClick={()=>updOrder(o.id,'delivered')}>✅ Livré</button>}
              </div></td>
            </tr>)}</tbody>
          </table></div>}
        </div>}

        {/* Vendeurs */}
        {tab==='sellers'&&<div className="fi">
          <h1 style={{fontWeight:900,fontSize:22,marginBottom:20}}>Vendeurs ({sellers.length})</h1>
          {sellers.length===0?<div style={{textAlign:'center',padding:'80px 20px'}}><div style={{fontSize:48,marginBottom:12}}>🏪</div><p style={{color:'var(--t3)'}}>Aucun vendeur inscrit</p></div>:
          <div className="tbl"><table><thead><tr>{['Vendeur','Boutique','Plan','Produits','Contact paiement','Certif.','Actions'].map(h=><th key={h}>{h}</th>)}</tr></thead>
            <tbody>{sellers.map(s=><tr key={s.id}>
              <td><div style={{fontWeight:600,fontSize:12}}>{s.name}</div><div style={{fontSize:10,color:'var(--t3)'}}>{s.email}</div></td>
              <td><div style={{fontSize:12}}>{s.store_name||'—'}</div><div style={{fontSize:10,color:'var(--t4)'}}>{s.store_type||''}</div></td>
              <td><span className={`badge ${s.plan==='pro'?'bgl':s.plan==='business'?'bgy':'bgn'}`} style={{fontSize:8}}>{PLANS[s.plan||'starter']?.name}</span></td>
              <td style={{fontSize:12}}>{s.products_count||0}</td>
              <td style={{fontSize:11,color:'var(--t2)'}}>{s.wave?'💛 '+s.wave:''}{s.wave&&s.om?<br/>:''}{s.om?'🟠 '+s.om:''}{!s.wave&&!s.om&&'—'}</td>
              <td>{s.certified?<span className="badge bgy" style={{fontSize:8}}>⭐ Certifié</span>:<span className="badge bgn" style={{fontSize:8}}>Non certifié</span>}</td>
              <td><button className="btn bsm" style={{background:s.certified?'rgba(244,63,94,.1)':'rgba(245,158,11,.1)',color:s.certified?'var(--err)':'var(--warn)',border:'none',fontSize:9,padding:'4px 8px'}} onClick={()=>certify(s.id,!s.certified)}>
                {s.certified?'Retirer ⭐':'⭐ Certifier'}
              </button></td>
            </tr>)}</tbody>
          </table></div>}
        </div>}

        {/* Retraits */}
        {tab==='withdrawals'&&<div className="fi">
          <h1 style={{fontWeight:900,fontSize:22,marginBottom:20}}>Demandes de retrait</h1>
          {withdrawals.length===0?<div style={{textAlign:'center',padding:'80px 20px'}}><div style={{fontSize:48,marginBottom:12}}>💸</div><p style={{color:'var(--t3)'}}>Aucune demande de retrait</p></div>:
          <div className="tbl"><table><thead><tr>{['Vendeur','Montant','Méthode','Numéro','Date','Statut','Action'].map(h=><th key={h}>{h}</th>)}</tr></thead>
            <tbody>{withdrawals.map(w=><tr key={w.id}>
              <td style={{fontWeight:600,fontSize:12}}>{w.seller_name}</td>
              <td><span style={{fontWeight:900,color:'var(--lime)',fontSize:14}}>{fcfa(w.amount)}</span></td>
              <td><span style={{fontWeight:600}}>{w.method==='wave'?'💛 Wave':'🟠 Orange Money'}</span></td>
              <td style={{fontFamily:'monospace',fontSize:12}}>{w.phone}</td>
              <td style={{fontSize:11,color:'var(--t3)'}}>{new Date(w.created_at).toLocaleDateString('fr-SN')}</td>
              <td><span className={`badge ${w.status==='processed'?'bgg':'bgy'}`} style={{fontSize:8}}>{w.status==='processed'?'Traité':'En attente'}</span></td>
              <td>{w.status==='pending'?<button className="btn bl bsm" onClick={()=>processWd(w)}>✓ Marquer traité</button>:<span style={{fontSize:11,color:'var(--t4)'}}>—</span>}</td>
            </tr>)}</tbody>
          </table></div>}
        </div>}

        {/* Catalogue */}
        {tab==='products'&&<div className="fi">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
            <h1 style={{fontWeight:900,fontSize:22}}>Catalogue ({prods.length})</h1>
          </div>
          {prods.length===0?<div style={{textAlign:'center',padding:'80px 20px'}}><div style={{fontSize:48,marginBottom:12}}>📦</div><p style={{color:'var(--t3)'}}>Aucun produit</p></div>:
          <div className="pgrid">{prods.map(p=><PCard key={p.id} p={p}/>)}</div>}
        </div>}
      </>}
    </main>
  </div>;
}

// ── Router ────────────────────────────────────────────────────────
function App(){
  const {user}=useAuth();
  const [r,setR]=useState(route());
  useEffect(()=>{const fn=()=>{setR(route());window.scrollTo(0,0)};window.addEventListener('hashchange',fn);return()=>window.removeEventListener('hashchange',fn)},[]);

  const page=()=>{
    if(r==='/'||r==='')return'land';if(r==='/marketplace')return'mkt';
    if(r.startsWith('/store/'))return'store';if(r==='/login')return'login';
    if(r==='/register')return'reg';if(r==='/dashboard')return'dash';
    if(r==='/platform-admin')return'admin';if(r==='/panier')return'cart';
    if(r==='/commande')return'checkout';if(r==='/commande/succes')return'ok';
    if(r.startsWith('/produit/'))return'prod';if(r==='/pricing')return'pricing';
    return'land';
  };

  const p=page();
  const storeSlug=r.startsWith('/store/')?r.split('/store/')[1]?.split('?')[0]:'';
  const prodId=r.startsWith('/produit/')?r.split('/produit/')[1]?.split('?')[0]:'';

  useEffect(()=>{if((p==='dash')&&!user)go('/login');if(p==='admin'&&user?.role!=='admin')go('/login')},[p,user]);

  const pages={
    land:<Landing/>,mkt:<Marketplace/>,store:<StorePage slug_={storeSlug}/>,
    login:<LoginPage/>,reg:<RegisterPage/>,pricing:<PricingPage/>,
    dash:user?<SellerDash/>:null,admin:user?.role==='admin'?<PlatformAdmin/>:null,
    cart:<CartPage/>,checkout:<CheckoutPage/>,ok:<SuccessPage/>,prod:<ProductPage id={prodId}/>
  };

  return <>{<Navbar/>}{pages[p]||<Landing/>}</>;
}

ReactDOM.render(<AuthProvider><CartProvider><App/></CartProvider></AuthProvider>,document.getElementById('root'));
</script>
</body>
</html>
