<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Soukdrop</title>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-extrabold text-blue-600">Soukdrop</h1>
    </nav>

    <div class="container mx-auto p-6">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Nos produits</h2>
        <div id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        
        fetch('https://jsonplaceholder.typicode.com/posts?_limit=9')
            .then(response => response.json())
            .then(data => {
                data.forEach(p => {
                    grid.innerHTML += `
                        <div class="bg-white p-5 rounded-xl shadow-sm hover:shadow-lg transition-shadow duration-300 border border-gray-200">
                            <h3 class="font-bold text-lg text-gray-700 mb-2">${p.title.substring(0, 20)}...</h3>
                            <p class="text-blue-600 font-semibold mb-4">Disponible</p>
                            <button class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Voir détails</button>
                        </div>
                    `;
                });
            })
            .catch(err => {
                grid.innerHTML = "<p class='text-red-500'>Erreur lors du chargement des produits.</p>";
            });
    </script>

</body>
</html>
