<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Soukdrop Store</title>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-white p-6 shadow-md text-center text-2xl font-bold">Soukdrop Store</nav>
    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-bold mb-6">Nos Produits</h1>
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </div>
    <script>
        const grid = document.getElementById('product-grid');
        // Ton API fournisseur ici
        fetch('https://jsonplaceholder.typicode.com/posts?_limit=9')
            .then(res => res.json())
            .then(data => {
                data.forEach(p => {
                    grid.innerHTML += `
                        <div class="bg-white p-4 rounded-lg shadow hover:shadow-xl transition">
                            <h3 class="font-bold text-lg mb-2">${p.title.substring(0, 20)}</h3>
                            <button class="bg-blue-600 text-white px-4 py-2 rounded w-full">Voir détails</button>
                        </div>`;
                });
            });
    </script>
</body>
</html>
